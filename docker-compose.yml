services:
  remote-runner:
    build: .
    container_name: remote-runner-container
    user: root
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Questo crea lo specchio tra la cartella attuale e il container
      - .:/app 
    restart: always
